<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rough-Fuzzy ECG Research Platform</title>
<style>
:root{--bg:#0b1220;--card:#131c2e;--bd:#24304a;--tx:#e6ecf5;--mut:#8a98b3;--ac:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}.tag{font-size:11px;color:#fbbf24;border:1px solid #fbbf2455;padding:2px 8px;border-radius:99px}
nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--ac);color:#04121f;border-color:var(--ac);font-weight:600}
main{padding:20px;max-width:1200px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span,.mut{color:var(--mut);font-size:12px}
canvas{width:100%;height:170px;display:block;background:var(--bg);border-radius:8px;border:1px solid var(--bd)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:500}
.sc{overflow:auto;max-height:340px}tr.cl{cursor:pointer}tr.cl:hover,tr.sel{background:#1b2a47}
.pill{padding:1px 8px;border-radius:99px;color:#04121f;font-weight:700;font-size:12px}
select,input{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit}input[type=number]{width:80px}input[type=range]{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar{height:8px;border-radius:4px;background:var(--ac)}
h2{font-size:15px;margin:0 0 10px}#ld{position:fixed;inset:0;background:#0b1220ee;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:9}
</style></head><body>
<div id="ld">Training Rough-Fuzzy models in your browser…</div>
<header><h1>🫀 Rough-Fuzzy ECG Research Platform</h1><span class="tag">Research prototype · not for clinical use</span></header>
<nav id="nav"></nav><main id="v"></main>
<script src="core.js"></script><script src="app.js"></script></body></html>
